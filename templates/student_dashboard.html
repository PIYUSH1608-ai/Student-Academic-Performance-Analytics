
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .Charts_pic {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .Charts_pic img {
            max-width: 100%;
            height: 300px;
            object-fit: contain;
            border-radius: 8px;
        }
        </style>
</head>
<body class="mt-5">
   <header>
        <img src="static/charts/IIT BHILAI Logo.png" alt="Logo" />
        <nav>
            <a href="/">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="/sign_in_student">Sign in(Student)</a>
            <a href="/sign_in_prof">Sign in(Prof)</a>
        </nav>
    </header> 
    <h1>{{ Name | capitalize }}'s Report</h1>
    <div class="Charts_pic">
        <img src="{{ chart }}" alt="Bar Chart">
    </div>
<table class="table table-bordered">
    <tr>
        <th>Subjects</th><th>Project</th><th>Assignment</th><th>Midsem</th><th>Endsem</th>
    </tr>
    {% for subject,score in Complete_data.items() %}
    <tr>
        <td>{{ subject }}</td>
        <td>{{ score["Project"] }}</td>
        <td>{{ score["Assignment"] }}</td>
        <td>{{ score["Midsem"] }}</td>
        <td>{{ score["Endsem"] }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
